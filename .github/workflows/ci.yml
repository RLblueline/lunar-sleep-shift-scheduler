name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  software:
    name: Engine, service and traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the UI
        run: python3 web/build.py
      - name: Engine tests
        run: node --test tests/js/*.test.js
      - name: Service, hardware and enclosure-report tests
        run: python3 -m unittest discover -s tests/py -v
      - name: Traceability (fails on a failing or missing test)
        run: python3 tools/trace.py

  cad:
    name: CAD design-rule checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CAD tools
        run: pip install cadquery trimesh rtree
      - name: Design-rule checks
        run: python3 cad/check.py
      - name: Report must match the committed one
        run: |
          python3 - <<'PY'
          import json, subprocess
          new = json.load(open("cad/out/check-report.json"))
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:cad/out/check-report.json"]))
          assert new["source_hash"] == old["source_hash"], "Commit the report: run python3 cad/check.py and add cad/out/check-report.json"
          assert [c["status"] for c in new["checks"]] == [c["status"] for c in old["checks"]], "Check results changed: commit the new report"
          PY
      - name: Export STEP and STLs
        run: python3 cad/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-cad
          path: cad/out/
