name: Bug
description: Something does not work as the requirements say
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Start the service  2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requirement affected
      placeholder: REQ-DAT-002
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Laptop (simulated hardware), Raspberry Pi, CAD model, Docs]
