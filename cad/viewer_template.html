<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet 3D viewer</title>
<style>
  :root { --bg: #e6e4df; --ink: #1d1f22; --muted: #5d6168; --line: #c9c6bf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141518; --ink: #eceae6; --muted: #9a9ea6; --line: #2c2f34; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  .rail { border-right: 1px solid var(--line); padding: 16px; overflow: auto; }
  .rail h1 { font-size: 16px; margin: 0 0 4px; } .rail p { color: var(--muted); margin: 0 0 12px; }
  .rail label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .rail button { margin: 4px 4px 0 0; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; }
  #view { position: relative; min-height: 0; }
  @media (max-width: 700px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .rail { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <h1>Lunar Sleep-Shift tablet</h1>
    <p>Drag to orbit, scroll to zoom. Generated by <code>cad/build.py</code>.</p>
    <div><button data-v="front">Front</button><button data-v="rear">Rear</button><button data-v="iso">3/4</button><button id="xray">X-ray</button><button id="explode">Explode</button></div>
    <h2 style="font-size:13px;margin:14px 0 4px">Parts</h2>
    <div id="list"></div>
  </div>
  <div id="view"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const MESHES = /*MESHES*/[];
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
const C = new THREE.Vector3(120, 69, 20);
controls.target.copy(C);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(-200, -300, 500); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(300, 400, -200); scene.add(rim);
const root = new THREE.Group(); scene.add(root);
const objs = [];
for (const m of MESHES) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(m.v, 3));
  g.setIndex(m.f);
  const flat = g.toNonIndexed(); flat.computeVertexNormals();   // flat shading: no streaks on planar faces
  const mat = new THREE.MeshStandardMaterial({ color: m.colour, roughness: m.kind === 'printed' ? 0.75 : 0.45, metalness: m.colour === '#b9bdc2' ? 0.6 : 0.05 });
  const o = new THREE.Mesh(flat, mat); o.userData = m; root.add(o); objs.push(o);
  flat.computeBoundingBox(); o.userData.centre = flat.boundingBox.getCenter(new THREE.Vector3());
}
const list = document.getElementById('list');
objs.forEach(o => { const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" checked> ${o.userData.name}`; l.firstChild.onchange = e => { o.visible = e.target.checked; }; list.appendChild(l); });
const VIEWS = { front: [120, -60, 520], rear: [120, 200, -480], iso: [-150, -260, 330] };
function setView(v) { camera.position.set(...VIEWS[v]); controls.update(); }
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
let xray = false, exploded = false;
document.getElementById('xray').onclick = () => { xray = !xray; objs.forEach(o => { const shell = ['Rear shell', 'Front bezel', 'Control panel overlay', 'Battery door', 'Compute hatch'].includes(o.userData.name); o.material.transparent = xray && shell; o.material.opacity = xray && shell ? 0.18 : 1; o.material.depthWrite = !(xray && shell); }); };
document.getElementById('explode').onclick = () => { exploded = !exploded; objs.forEach(o => { const z = o.userData.centre.z; o.position.z = exploded ? (z > 36 ? 60 : z < 6 ? -40 : 0) + (z > 42 ? 40 : 0) : 0; }); };
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x141518 : 0xe6e4df);
resize(); setView('iso');
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
window.__three = { THREE, scene, camera, controls, renderer, objs, setView, VIEWS };
</script>
</body>
</html>
